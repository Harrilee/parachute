name: Publish reviewed native release

on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - scripts/release/publish.py
      - Tests/ReleaseTests/PublicationTests.py
      - Resources/Sparkle/public-key.txt
  workflow_dispatch:
    inputs:
      action:
        description: Validate artifacts, prepare a review draft, or explicitly publish that draft
        required: true
        type: choice
        options: [validate, draft, publish]
        default: draft
      source_run_id:
        description: Successful native release.yml build run
        required: true
        type: string
      source_commit:
        description: Exact 40-character commit tested by the source run
        required: true
        type: string
      version:
        description: Native version in the reviewed artifacts
        required: true
        type: string
        default: '1.0.1'

permissions:
  actions: read
  contents: read

concurrency:
  group: native-publication-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publication safeguards
        run: python3 Tests/ReleaseTests/PublicationTests.py

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICATION_ACTION: ${{ inputs.action }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and promote the existing native artifacts
        run: |
          python3 scripts/release/publish.py --action "$PUBLICATION_ACTION" \
            --source-run-id "$SOURCE_RUN_ID" --source-commit "$SOURCE_COMMIT" \
            --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/native-publication"
      - name: Retain internal publication evidence and signed update feeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-publication-${{ inputs.version }}-${{ inputs.source_run_id }}
          path: |
            ${{ runner.temp }}/native-publication/release-provenance.json
            ${{ runner.temp }}/native-publication/feeds/*.xml
            ${{ runner.temp }}/native-publication/migration-evidence-*/**/*
          if-no-files-found: warn
          retention-days: 30
