name: Prepare macOS release

# Replaces automatic tag publication. Artifacts and update feeds are reviewed
# before the explicit promotion described in native/release/README.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Native marketing version
        required: true
        default: '0.4.0'
        type: string
      build_number:
        description: Monotonically increasing native build number
        required: true
        default: '400000'
        type: string

      bridge_run_id:
        description: Optional successful Electron 0.3.9 CI run for PR-only migration validation
        required: false
        default: ''
        type: string
      bridge_commit:
        description: Exact approved source commit for bridge_run_id
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    uses: ./.github/workflows/native-release.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ inputs.build_number }}
      bridge_run_id: ${{ inputs.bridge_run_id }}
      bridge_commit: ${{ inputs.bridge_commit }}
      bundle_id: com.electron.parachute
      feed_base_url: https://raw.githubusercontent.com/Harrilee/parachute/main/updates
    secrets: inherit
