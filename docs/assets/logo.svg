<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="mainGrad" x1="0" y1="30" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#40C4FF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    
    <g stroke="url(#mainGrad)" stroke-width="3.5" stroke-linecap="round">
      <line x1="48" y1="105" x2="108" y2="150" />
      <line x1="95" y1="105" x2="116" y2="150" />
      <line x1="145" y1="105" x2="124" y2="150" />
      <line x1="192" y1="105" x2="132" y2="150" />
    </g>

    <path d="M 45 105 
             A 75 75 0 0 1 195 105
             Q 170 95, 145 105 
             Q 120 95, 95 105 
             Q 70 95, 45 105 Z" 
          fill="url(#mainGrad)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    
    <path d="M 120 30 A 45 75 0 0 1 145 105" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M 120 30 A 45 75 0 0 0 95 105" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <path d="M 92 165 
             A 28 28 0 1 1 148 165 
             C 148 188, 130 208, 120 215 
             C 110 208, 92 188, 92 165 Z" 
          fill="url(#mainGrad)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    
